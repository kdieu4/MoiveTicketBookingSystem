# ============================================================
#  MTBS - User Service
#  Issue #3 - feature/be-user-service
#
#  Pham vi tuan nay: CHUA dung Authentication, JWT va Role.
#  API hien co:
#    - GET    /api/users           (danh sach co phan trang)
#    - GET    /api/users/{id}      (chi tiet, Booking Service dung de kiem tra)
#    - PUT    /api/users/{id}      (cap nhat thong tin)
#    - DELETE /api/users/{id}      (xoa)
# ============================================================

# Bien cua moi truong nam trong file .env CUNG thu muc nay.
# DUONG DAN QUAN TRONG: duong dan ben phai la TUONG DOI so voi thu muc dang
# chay (working directory). Phai chay app tu user-service/ thi moi doc duoc
# .env. Chay tu thu muc khoc se khong co bien -> app bao loi truy cap MySQL bi
# tu cho. File .env da nam trong .gitignore nen khong bao gio len GitHub.
spring.config.import=optional:file:./.env[.properties]

# Port rieng cho User Service
server.port=8081
spring.application.name=user-service

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mtbs_user_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chay data.sql SAU khi Hibernate da tao bang
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

logging.level.com.mtbs.user_service=DEBUG