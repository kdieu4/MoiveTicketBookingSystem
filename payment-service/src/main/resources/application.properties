spring.config.import=optional:file:.env[.properties]

spring.application.name=payment-service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

momo.partner-code=MOMO
momo.return-url=http://localhost:3000/
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/
momo.ipn-url=http://localhost:8000/api/momo/ipn-handler
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.request-type=captureWallet

vnpay.hash-secret=${VNP_HASH_SECRET}
vnpay.tmn-code=${VNP_TMN_CODE}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8084/api/v1/vnpay/return
vnpay.version=2.1.0

vietqr.bank-id=${BANK_ID}
vietqr.account-no=${ACCOUNT_NO}
vietqr.account-name=${ACCOUNT_NAME}
vietqr.template=compact2